# DSGVO-konformes lokales RAG
#
# Netzwerk-Design:
#   rag_internal  internal: true  → app, qdrant, ollama. KEIN Internetzugang (kein Gateway).
#   rag_edge      bridge          → nur der nginx-Gateway; Port ausschließlich an 127.0.0.1.
#   rag_egress    bridge          → nur der einmalige `model-pull`-Job (Profil "setup").
#
# Personenbezogene Daten werden nur in Containern verarbeitet, die das Internet nicht
# erreichen können. Prüfen mit: `make verify-isolation`.

name: dsgvo-rag

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  gateway:
    <<: *hardening
    image: nginx:1.30.6-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RAG_PORT:-8000}:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [rag_internal, rag_edge]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]

  app:
    <<: *hardening
    build: .
    image: dsgvo-rag-app:latest
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_OLLAMA_BASE_URL: http://ollama:11434
      RAG_LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data:ro
    networks: [rag_internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]

  qdrant:
    <<: *hardening
    image: qdrant/qdrant:v1.20.2-unprivileged
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [rag_internal]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    <<: *hardening
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama_data:/root/.ollama
    networks: [rag_internal]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Einmaliger Download des LLM. Einziger Container mit Internetzugang; verarbeitet keine Daten.
  #   docker compose --profile setup run --rm model-pull
  model-pull:
    image: ollama/ollama:0.40.16
    profiles: [setup]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve >/dev/null 2>&1 &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$${LLM_MODEL}"
    environment:
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
    volumes:
      - ollama_data:/root/.ollama
    networks: [rag_egress]

networks:
  rag_internal:
    internal: true
  rag_edge:
    driver: bridge
    driver_opts:
      # Defense in depth: no outbound NAT, the gateway only answers requests from the host.
      com.docker.network.bridge.enable_ip_masquerade: "false"
  rag_egress:
    driver: bridge

volumes:
  qdrant_data:
  ollama_data:
